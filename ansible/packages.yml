---
- name: Install and Uninstall packages.
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    apt_wanted:
        - audacity
        - net-tools
        - lm-sensors
        - cryptsetup
        - curl
        - ufw
        - pass
        - pass-extension-otp
        - moreutils
        - htop
        - wofi
        - papirus-icon-theme
        - libnotify-bin
        - qbittorrent
        - mullvad-vpn
        - signal-desktop
        - zbar-tools
        - build-essential
    apt_unwanted:
        - thunderbird
        - rhythmbox
        - shotwell
        - snapd
        - kmail

  tasks:
    - name: Fail on non-Debian
      fail:
        msg: "This playook is meant for Debian-based systems"
      when: ansible_os_family != "Debian"

    - name: Verify sudo privileges
      ansible.builtin.command: whoami
      become: yes
      register: sudo_check
      changed_when: false
      failed_when: sudo_check.stdout != 'root'

    - name: Download and dearmor Mullvad signing key
      become: yes
      ansible.builtin.shell:
        cmd: >
          curl -fsSL https://repository.mullvad.net/deb/mullvad-keyring.asc
          | gpg --dearmor
          > /usr/share/keyrings/mullvad-keyring.gpg
        creates: /usr/share/keyrings/mullvad-keyring.gpg

    - name: Add the 'mullvad' repository
      become: yes
      ansible.builtin.deb822_repository:
        name: Mullvad VPN stable
        types: deb
        uris: https://repository.mullvad.net/deb/stable
        suites: stable
        components:
          - main
        architectures: amd64
        signed_by: /usr/share/keyrings/mullvad-keyring.gpg
        enabled: true
        state: present

    - name: Download and dearmor Signal signing key
      become: yes
      ansible.builtin.shell:
        cmd: >
          curl -fsSL https://updates.signal.org/desktop/apt/keys.asc
          | gpg --dearmor
          > /usr/share/keyrings/signal-desktop-keyring.gpg
        creates: /usr/share/keyrings/signal-desktop-keyring.gpg

    - name: Add the 'signal' repository
      become: yes
      ansible.builtin.deb822_repository:
        name: Signal stable
        types: deb
        uris: https://updates.signal.org/desktop/apt
        suites: xenial
        components:
          - main
        architectures: amd64
        signed_by: /usr/share/keyrings/signal-desktop-keyring.gpg
        enabled: true
        state: present

    - name: Update APT cache
      apt:
        update_cache: yes
      become: yes

    - name: Remove unwanted packages
      apt:
        name: "{{ apt_unwanted }}"
        state: absent
        purge: yes
      become: yes
      ignore_errors: yes

    - name: Install wanted packages
      apt:
        name: "{{ apt_wanted }}"
        state: present
      become: yes

    - name: Autoremove unused packages
      apt:
        autoremove: yes
      become: yes
